<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopper - New Launches</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ===== SECTION CSS START (newl) ===== -->
<style>

.newl{--newl-green:#16b57a;--newl-purple:#8a5cc8;--newl-ink:#1f2430;--newl-muted:#7b8190;
  font-family:'Poppins',system-ui,sans-serif;color:var(--newl-ink);box-sizing:border-box;width:100%;}
.newl *,.newl *::before,.newl *::after{box-sizing:border-box;}
.newl a{text-decoration:none;color:inherit;}
.newl h1,.newl h2,.newl h3,.newl p,.newl ul{margin:0;padding:0;}
.newl ul{list-style:none;}
.newl button{font-family:inherit;cursor:pointer;}

.newl{padding:48px 40px;background:#fff;}
.newl__title{text-align:center;font-size:20px;font-weight:600;margin-bottom:28px;}
.newl__banner{background:var(--newl-purple);color:#fff;border-radius:6px;padding:36px 56px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;position:relative;max-width:1100px;margin:0 auto;}
.newl__arches{display:flex;gap:14px;align-items:flex-end;}
.newl__arch{width:110px;background:#fff;border-radius:70px;display:grid;place-items:center;font-size:48px;}
.newl__arch--1{height:200px;}.newl__arch--2{height:170px;}
.newl__content{flex:1 1 300px;max-width:420px;}
.newl__name{font-size:28px;font-weight:600;margin-bottom:10px;}
.newl__desc{font-size:13px;line-height:1.7;opacity:.85;}
.newl__price{margin:14px 0;font-size:15px;}
.newl__price b{font-size:18px;}
.newl__colors{display:flex;gap:10px;margin-bottom:20px;}
.newl__dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;padding:0;}
.newl__dot--active{box-shadow:0 0 0 2px rgba(255,255,255,.6);}
.newl__actions{display:flex;align-items:center;gap:20px;}
.newl__btn{background:var(--newl-green);color:#fff;border:0;border-radius:6px;padding:12px 28px;font-size:14px;font-weight:500;}
.newl__link{font-size:14px;}
.newl__nav{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:0;background:var(--newl-green);color:#fff;font-size:10px;}
.newl__nav--prev{left:8px;}.newl__nav--next{right:8px;}
@media(max-width:700px){.newl{padding:32px 16px;}.newl__banner{padding:28px 24px;}}

</style>
<!-- ===== SECTION CSS END (newl) ===== -->
</head>
<body style="margin:0">
<!-- ===== SECTION HTML START (newl) ===== -->
<section class="newl" id="newl-root">
  <h2 class="newl__title">New Launches</h2>
  <div class="newl__banner">
    <button class="newl__nav newl__nav--prev" type="button" aria-label="Previous">&#10094;</button>
    <div class="newl__arches">
      <div class="newl__arch newl__arch--1">&#127911;</div>
      <div class="newl__arch newl__arch--2">&#127911;</div>
    </div>
    <div class="newl__content">
      <h3 class="newl__name">Airdrop 500 Anc</h3>
      <p class="newl__desc">Lorem ipsum is a placeholder text commonly used to demonstrate the visual form of a product.</p>
      <p class="newl__price">Price : <b>$45.99</b></p>
      <div class="newl__colors" id="newl-colors">
        <button class="newl__dot newl__dot--active" style="background:#111" type="button" aria-label="Black"></button>
        <button class="newl__dot" style="background:#f6c915" type="button" aria-label="Yellow"></button>
        <button class="newl__dot" style="background:#2f6bff" type="button" aria-label="Blue"></button>
      </div>
      <div class="newl__actions">
        <button class="newl__btn" type="button">Add to cart</button>
        <a class="newl__link" href="#">Explore More</a>
      </div>
    </div>
    <button class="newl__nav newl__nav--next" type="button" aria-label="Next">&#10095;</button>
  </div>
</section>
<!-- ===== SECTION HTML END (newl) ===== -->
<!-- ===== SECTION JS START (newl) ===== -->
<script>
(function () {
  var wrap = document.getElementById('newl-colors');
  if (!wrap) return;
  var dots = wrap.querySelectorAll('.newl__dot');
  dots.forEach(function (d) {
    d.addEventListener('click', function () {
      dots.forEach(function (x) { x.classList.remove('newl__dot--active'); });
      d.classList.add('newl__dot--active');
    });
  });
})();
</script>
<!-- ===== SECTION JS END (newl) ===== -->
</body>
</html>
