<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopper - Top Sellers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ===== SECTION CSS START (tops) ===== -->
<style>

.tops{--tops-green:#16b57a;--tops-purple:#8a5cc8;--tops-ink:#1f2430;--tops-muted:#7b8190;
  font-family:'Poppins',system-ui,sans-serif;color:var(--tops-ink);box-sizing:border-box;width:100%;}
.tops *,.tops *::before,.tops *::after{box-sizing:border-box;}
.tops a{text-decoration:none;color:inherit;}
.tops h1,.tops h2,.tops h3,.tops p,.tops ul{margin:0;padding:0;}
.tops ul{list-style:none;}
.tops button{font-family:inherit;cursor:pointer;}

.tops{padding:48px 40px;background:#fff;}
.tops__title{text-align:center;font-size:20px;font-weight:600;margin-bottom:20px;}
.tops__tabs{display:flex;justify-content:center;gap:10px;margin-bottom:28px;}
.tops__tab{border:0;background:transparent;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;}
.tops__tab--active{background:var(--tops-green);color:#fff;}
.tops__row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;}
.tops__grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;}
.tops__arrow{color:var(--tops-green);font-size:22px;border:0;background:none;}
.tops__card{border-radius:10px;padding:14px;position:relative;}
.tops__badge{position:absolute;top:12px;right:12px;background:var(--tops-green);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:9px;line-height:1.1;text-align:center;}
.tops__img{height:150px;display:grid;place-items:center;font-size:72px;}
.tops__info{background:#fff;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;}
.tops__name{font-weight:500;}
.tops__stars{color:#f5a623;font-size:11px;margin:4px 0;}
.tops__stars small{color:var(--tops-muted);}
.tops__price{font-weight:600;}
.tops__add{display:block;width:calc(100% - 0px);margin-top:12px;background:var(--tops-green);color:#fff;border:0;border-radius:4px;padding:8px;font-size:13px;}
@media(max-width:700px){.tops{padding:32px 16px;}.tops__arrow{display:none;}}

</style>
<!-- ===== SECTION CSS END (tops) ===== -->
</head>
<body style="margin:0">
<!-- ===== SECTION HTML START (tops) ===== -->
<section class="tops" id="tops-root">
  <h2 class="tops__title">Top Sellers</h2>
  <div class="tops__tabs" id="tops-tabs">
      <button class="tops__tab tops__tab--active" type="button" data-tops-tab="0">Top Picks</button>
      <button class="tops__tab" type="button" data-tops-tab="1">Watches</button>
  </div>
  <div class="tops__row">
    <div class="tops__grid" id="tops-grid">
      <article class="tops__card" style="background:#e6f7ef">
        <span class="tops__badge">Save<br>50%</span>
        <div class="tops__img">&#127911;</div>
        <div class="tops__info">
          <div class="tops__name">Beat Rockerz 332</div>
          <div class="tops__stars">&#9733;&#9733;&#9733;&#9733;&#9733; <small>1 reviews</small></div>
          <div class="tops__price">$20</div>
        </div>
        <button class="tops__add" type="button">Add to cart</button>
      </article>
      <article class="tops__card" style="background:#d3effb">
        <span class="tops__badge">Save<br>50%</span>
        <div class="tops__img">&#127911;</div>
        <div class="tops__info">
          <div class="tops__name">Beat Rockerz 332</div>
          <div class="tops__stars">&#9733;&#9733;&#9733;&#9733;&#9733; <small>1 reviews</small></div>
          <div class="tops__price">$20</div>
        </div>
        <button class="tops__add" type="button">Add to cart</button>
      </article>
      <article class="tops__card" style="background:#e6dcf7">
        <span class="tops__badge">Save<br>50%</span>
        <div class="tops__img">&#127911;</div>
        <div class="tops__info">
          <div class="tops__name">Beat Rockerz 332</div>
          <div class="tops__stars">&#9733;&#9733;&#9733;&#9733;&#9733; <small>1 reviews</small></div>
          <div class="tops__price">$20</div>
        </div>
        <button class="tops__add" type="button">Add to cart</button>
      </article>
    </div>
    <button class="tops__arrow" type="button" aria-label="Next">&#10095;</button>
  </div>
</section>
<!-- ===== SECTION HTML END (tops) ===== -->
<!-- ===== SECTION JS START (tops) ===== -->
<script>
(function () {
  var root = document.getElementById('tops-root');
  if (!root) return;
  var tabs = root.querySelectorAll('[data-tops-tab]');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('tops__tab--active'); });
      tab.classList.add('tops__tab--active');
    });
  });
})();
</script>
<!-- ===== SECTION JS END (tops) ===== -->
</body>
</html>
