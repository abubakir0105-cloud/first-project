<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopper - Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ===== SECTION CSS START (ftr) ===== -->
<style>

.ftr{--ftr-green:#16b57a;--ftr-purple:#8a5cc8;--ftr-ink:#1f2430;--ftr-muted:#7b8190;
  font-family:'Poppins',system-ui,sans-serif;color:var(--ftr-ink);box-sizing:border-box;width:100%;}
.ftr *,.ftr *::before,.ftr *::after{box-sizing:border-box;}
.ftr a{text-decoration:none;color:inherit;}
.ftr h1,.ftr h2,.ftr h3,.ftr p,.ftr ul{margin:0;padding:0;}
.ftr ul{list-style:none;}
.ftr button{font-family:inherit;cursor:pointer;}

.ftr{background:#fff;padding:32px 64px 24px;border-top:1px solid #eef0f4;}
.ftr__cta{display:flex;justify-content:flex-end;align-items:center;gap:16px;font-size:13px;margin-bottom:28px;}
.ftr__cta-btn{background:var(--ftr-green);color:#fff;border:0;border-radius:4px;padding:8px 18px;font-size:13px;}
.ftr__cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.ftr__head{font-size:12px;font-weight:600;color:var(--ftr-green);margin-bottom:10px;}
.ftr__list li{font-size:11px;color:var(--ftr-muted);margin-bottom:6px;}
.ftr__sub-label{font-size:12px;font-weight:600;margin-bottom:8px;}
.ftr__sub{display:flex;border:1px solid #dfe3ea;border-radius:4px;overflow:hidden;max-width:220px;}
.ftr__sub-input{border:0;padding:8px 10px;font-family:inherit;font-size:11px;flex:1;min-width:0;outline:0;}
.ftr__sub-btn{border:0;background:var(--ftr-green);color:#fff;padding:0 12px;}
.ftr__bottom{display:flex;justify-content:space-between;align-items:center;margin-top:32px;font-size:10px;color:var(--ftr-muted);flex-wrap:wrap;gap:12px;}
.ftr__legal{display:flex;gap:16px;}
.ftr__social{display:flex;gap:14px;}
@media(max-width:700px){.ftr{padding:24px 20px;}.ftr__cols{grid-template-columns:1fr 1fr;}.ftr__cta{justify-content:space-between;}}

</style>
<!-- ===== SECTION CSS END (ftr) ===== -->
</head>
<body style="margin:0">
<!-- ===== SECTION HTML START (ftr) ===== -->
<footer class="ftr" id="ftr-root">
  <div class="ftr__cta">
    <span>Ready to get started?</span>
    <button class="ftr__cta-btn" type="button">Get started</button>
  </div>
  <div class="ftr__cols">
    <div class="ftr__col">
      <p class="ftr__sub-label">Subscribe to our Website</p>
      <form class="ftr__sub" id="ftr-sub" onsubmit="return false">
        <input class="ftr__sub-input" type="email" placeholder="Enter your email">
        <button class="ftr__sub-btn" type="submit" aria-label="Subscribe">&#10148;</button>
      </form>
    </div>
    <div class="ftr__col"><h4 class="ftr__head">Services</h4>
      <ul class="ftr__list"><li>Advertising</li><li>Campaigns</li><li>Branding</li><li>Offers</li></ul></div>
    <div class="ftr__col"><h4 class="ftr__head">Store</h4>
      <ul class="ftr__list"><li>Our Story</li><li>Benefits</li><li>Team</li><li>Careers</li></ul></div>
    <div class="ftr__col"><h4 class="ftr__head">Help</h4>
      <ul class="ftr__list"><li>Faqs</li><li>Contact Us</li></ul></div>
  </div>
  <div class="ftr__bottom">
    <div class="ftr__legal"><span>Terms &amp; Conditions</span><span>Privacy Policy</span></div>
    <div class="ftr__social"><span>f</span><span>t</span><span>in</span></div>
  </div>
</footer>
<!-- ===== SECTION HTML END (ftr) ===== -->



</body>
</html>
